# Bo theo doi nguoi cho camera chan cau (BoT-SORT cua Ultralytics), chinh cho
# dong nguoi di bo: giu ID lau hon khi bi che khuat ngan (track_buffer) va dung ReID
# de KHONG bi nhay/doi ID khi nguoi di sat nhau hoac che khuat nhau. Dung: --tracker <tep nay>
tracker_type: botsort
track_high_thresh: 0.35   # nguong tin cay de khop vong 1 (mac dinh 0.25-0.5)
track_low_thresh: 0.1     # vong 2 voi khung tin cay thap (nguoi bi che 1 phan)
new_track_thresh: 0.45    # nguong tao ID moi - cao hon de han che ID ao
track_buffer: 90          # tang len 90 khung (~6 giay o 15 fps) de giu ID lau hon khi khach di cham/che khuat
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow # bu chuyen dong camera (camera rung nhe)
proximity_thresh: 0.5     # nguong khoang cach khong gian IoU
appearance_thresh: 0.25   # nguong dac trung ngoai hinh ReID
with_reid: true           # BAT REID: dung feature embedding tu detector de nhan dien lai nguoi, chong nhay ID
model: auto
